// Archivo raíz de Gradle. Los plugins se declaran aquí y se aplican en :app.
//
// Nota: a partir de AGP 9.0 el soporte de Kotlin viene incluido ("built-in
// Kotlin"), por eso NO se aplica el plugin org.jetbrains.kotlin.android.
// AGP usa el KGP 2.2.10 o superior automáticamente.
plugins {
    id 'com.android.application' version '9.4.1' apply false
    id 'com.google.devtools.ksp' version '2.3.12' apply false
}
